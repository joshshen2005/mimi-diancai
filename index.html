  <div class="mobile-dock" id="mobile-dock" hidden>
    <button type="button" class="button button-primary full" id="review-order">查看点单 <span id="dock-count"></span></button>
  </div>
  <dialog id="receipt" aria-labelledby="receipt-title">
    <div class="dialog-inner">
      <div class="success-mark" aria-hidden="true">✓</div>
      <p class="eyebrow">ORDER RECEIVED</p>
      <h2 id="receipt-title">点单已送出</h2>
      <p id="receipt-summary" class="muted"></p>
      <ul id="receipt-lines" class="receipt-lines"></ul>
      <p id="receipt-note" class="muted"></p>
      <form method="dialog"><button type="submit" class="button button-primary full">完成</button></form>
    </div>
  </dialog>
<script>
"use strict";

const $ = (id) => document.getElementById(id);

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function button(text, className, action) {
  const node = element("button", className, text);
  node.type = "button";
  node.addEventListener("click", action);
  return node;
}

function showMessage(node, message) {
  node.hidden = !message;
  node.textContent = message || "";
}

async function request(path, data) {
  const options = data === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  };
  let response;
  let content;
  try {
    const url = new URL(path, document.documentElement.dataset.apiOrigin);
    response = await fetch(url, { ...options, credentials: "omit" });
    content = await response.json();
  } catch {
    throw new Error("暂时连不上点菜服务，请检查网络后重试。");
  }
  if (!response.ok) {
    const error = new Error(content.error || "操作失败，请稍后重试。");
    error.status = response.status;
    throw error;
  }
  return content;
}

function dishIcon(dish) {
  const food = dish.name + " " + dish.category;
  const choices = [
    [/可乐|雪碧|芬达|美年达|七喜|汽水|苏打|运动饮料/, "🥤", 3],
    [/汁|豆奶/, "🧃", 0],
    [/矿泉水/, "💧", 3],
    [/咖啡|茶/, "🍵", 3],
    [/软饮|特饮/, "🥤", 3],
    [/面|粉|意面/, "🍜", 0],
    [/凉拌|蔬菜|黄瓜|西兰花|沙拉|小菜|时蔬/, "🥗", 1],
    [/番茄|西红柿/, "🍅", 2],
    [/鸡|鸭|禽/, "🍗", 0],
    [/主食|饭|米|粥/, "🍚", 0],
    [/点心|甜|蛋糕|冰淇淋/, "🍰", 3],
    [/鱼|虾|海鲜/, "🐟", 1],
  ];
  const [, symbol, tone] = choices.find(([pattern]) => pattern.test(food)) || [null, "🍲", 2];
  const node = element("span", "dish-icon", symbol);
  node.setAttribute("aria-hidden", "true");
  node.dataset.tone = tone;
  return node;
}

function orderItemName(item) {
  const name = element("span", "", item.name);
  if (item.temperature) name.append(element("small", "temperature-tag", item.temperature));
  return name;
}

function orderLines(items, listClass) {
  const list = element("ul", listClass);
  for (const item of items) {
    const row = element("li");
    const details = element("div", "order-item-details");
    details.append(orderItemName(item));
    if (item.note) details.append(element("p", "muted item-note", `菜品备注  ${item.note}`));
    row.append(details, element("strong", "", `× ${item.quantity}`));
    list.append(row);
  }
  return list;
}

function orderNumber(code) {
  return "#" + code;
}

</script>
<script>
"use strict";

let dishes = new Map();
let categoryNames = [];
let temperatureOptions = {};
const chosenTemperatures = new Map();
const selections = new Map();
const steppers = new Map();
const form = $("order-form");
const submit = $("submit-order");
const submitError = $("submit-error");
let category = null;
let submitting = false;
let lastAttempt;

function totalQuantity() {
  return Array.from(selections.values()).reduce((total, item) => total + item.quantity, 0);
}

function selectionKey(id, temperature) {
  return id + ":" + temperature;
}

function temperatureFor(dish) {
  const options = temperatureOptions[dish.category] || [];
  const chosen = chosenTemperatures.get(dish.id);
  return options.includes(chosen) ? chosen : (options[0] || "");
}

function quantityForDish(id) {
  let quantity = 0;
  for (const item of selections.values()) {
    if (item.id === id) quantity += item.quantity;
  }
  return quantity;
}

function updateQuantity(dish, change) {
  const temperature = temperatureFor(dish);
  const key = selectionKey(dish.id, temperature);
  const selection = selections.get(key) || { id: dish.id, temperature, quantity: 0, note: "" };
  const quantity = selection.quantity + change;
  if (change > 0 && (quantityForDish(dish.id) >= 20 || totalQuantity() >= 99)) return;
  if (change > 0 && selections.size >= 40 && !selections.has(key)) return;
  if (quantity <= 0) selections.delete(key);
  else selections.set(key, { ...selection, quantity });
  showMessage(submitError, "");
  renderCart();
}

function renderCategories() {
  const categories = $("categories");
  categories.replaceChildren();
  if (!categoryNames.includes(category)) category = null;

  for (const name of [null, ...categoryNames]) {
    const filter = button(name ?? "全部", "filter", () => {
      category = name;
      for (const tab of categories.children) tab.setAttribute("aria-pressed", tab === filter);
      renderDishes();
    });
    filter.setAttribute("aria-pressed", category === name);
    categories.append(filter);
  }
}

function renderDishes() {
  const list = $("dish-list");
  list.replaceChildren();
  steppers.clear();
  const visible = Array.from(dishes.values()).filter((dish) => !category || dish.category === category);
  $("dish-count").textContent = `${visible.length} 道菜品`;
  showMessage($("menu-status"), visible.length ? "" : category
    ? "这个分区暂时没有菜品。"
    : "今天的菜单还在准备中。");
  for (const dish of visible) {
    const card = element("article", "dish-card");
    const info = element("div", "dish-info");
    const text = element("div");
    text.append(element("h3", "", dish.name));
    if (dish.description) text.append(element("p", "", dish.description));
    info.append(dishIcon(dish), text);

    const bottom = element("div", "dish-bottom");
    const temperatureButtons = new Map();
    const options = temperatureOptions[dish.category] || [];
    if (options.length) {
      const group = element("div", "temperature-choices");
      group.setAttribute("role", "group");
      group.setAttribute("aria-label", `${dish.name}的温度`);
      for (const temperature of options) {
        const choice = button(temperature, "temperature-choice", () => {
          chosenTemperatures.set(dish.id, temperature);
          renderCart();
        });
        temperatureButtons.set(temperature, choice);
        group.append(choice);
      }
      card.classList.add("drink-card");
      bottom.append(group);
    } else {
      bottom.append(element("span", "dish-category", dish.category));
    }

    const stepper = element("div", "stepper");
    const decrease = button("−", "", () => updateQuantity(dish, -1));
    const amount = element("span");
    const increase = button("+", "add", () => updateQuantity(dish, 1));
    stepper.append(decrease, amount, increase);
    steppers.set(dish.id, { decrease, amount, increase, temperatureButtons });

    bottom.append(stepper);
    card.append(info, bottom);
    list.append(card);
  }
  renderCart();
}

function renderCart() {
  const total = totalQuantity();
  const lines = $("cart-lines");
  lines.replaceChildren(total ? cartLines() : element("p", "cart-empty", "还没选菜。点击「＋」加入点单。"));
  $("cart-count").textContent = `${total} 份`;
  $("dock-count").textContent = `${total} 份 →`;
  $("mobile-dock").hidden = total === 0;
  submit.disabled = total === 0 || submitting;
  form.elements.name.readOnly = submitting;
  form.elements.note.readOnly = submitting;
  for (const [id, controls] of steppers) {
    const dish = dishes.get(id);
    const temperature = temperatureFor(dish);
    const quantity = selections.get(selectionKey(id, temperature))?.quantity || 0;
    const label = temperature ? `${dish.name}（${temperature}）` : dish.name;
    controls.decrease.setAttribute("aria-label", `减少一份${label}`);
    controls.increase.setAttribute("aria-label", `增加一份${label}`);
    for (const [option, choice] of controls.temperatureButtons) {
      choice.setAttribute("aria-pressed", temperature === option);
      choice.disabled = submitting;
    }
    controls.amount.textContent = quantity;
    controls.decrease.disabled = submitting || quantity === 0;
    controls.increase.disabled = submitting || quantityForDish(id) >= 20
      || total >= 99 || (selections.size >= 40 && !quantity);
  }
}

function cartLines() {
  const list = element("ul", "cart-lines");
  for (const [key, selection] of selections) {
    const dish = dishes.get(selection.id);
    const row = element("li", "cart-item");
    const heading = element("div", "cart-line");
    const name = orderItemName({ name: dish.name, temperature: selection.temperature });
    name.id = `cart-dish-${key}`;
    heading.append(name, element("strong", "", `× ${selection.quantity}`));

    const label = element("label", "cart-note-label", "菜品备注（选填）");
    label.id = `note-label-${key}`;
    label.htmlFor = `dish-note-${key}`;
    const input = element("input");
    input.id = label.htmlFor;
    input.type = "text";
    input.maxLength = 100;
    input.placeholder = "例如：少辣、不要葱";
    input.readOnly = submitting;
    input.value = selection.note;
    input.setAttribute("aria-labelledby", `${name.id} ${label.id}`);
    input.addEventListener("input", () => {
      selection.note = input.value;
    });

    row.append(heading, label, input);
    list.append(row);
  }
  return list;
}

async function loadMenu() {
  try {
    const data = await request("/api/menu");
    const next = new Map(data.dishes.map((dish) => [dish.id, dish]));
    temperatureOptions = data.temperatureOptions || {};
    for (const [key, { id, temperature }] of selections) {
      const dish = next.get(id);
      const options = temperatureOptions[dish?.category] || [];
      const temperatureValid = options.length ? options.includes(temperature) : temperature === "";
      if (!dish || dish.name !== dishes.get(id)?.name || !temperatureValid) selections.delete(key);
    }
    dishes = next;
    categoryNames = data.categories;
    renderCategories();
    renderDishes();
  } catch (error) {
    showMessage($("menu-status"), error.message);
  }
}

function showReceipt(order) {
  $("receipt-summary").textContent = `${order.name}，你的点单 ${orderNumber(order.code)} 已送到收单台。`;
  $("receipt-lines").replaceChildren(...orderLines(order.items, "").children);
  showMessage($("receipt-note"), order.note ? `整单备注  ${order.note}` : "");
  $("receipt").showModal();
}

$("review-order").addEventListener("click", () => {
  $("cart-title").focus({ preventScroll: true });
  $("cart").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" });
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (submitting || !selections.size) return;

  const order = {
    name: form.elements.name.value.trim(),
    note: form.elements.note.value.trim(),
    items: Array.from(selections.values(), ({ id, temperature, quantity, note }) => ({
      id, name: dishes.get(id).name, temperature, quantity, note: note.trim(),
    })),
  };
  if (!order.name) {
    showMessage(submitError, "请填写你的称呼。");
    form.elements.name.focus();
    return;
  }

  const snapshot = JSON.stringify(order);
  if (lastAttempt?.snapshot !== snapshot) {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    const requestId = Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
    lastAttempt = { snapshot, requestId };
  }
  showMessage(submitError, "");
  submitting = true;
  submit.firstChild.textContent = "正在提交 ";
  renderCart();
  try {
    const receipt = await request("/api/orders", { ...order, requestId: lastAttempt.requestId });
    selections.clear();
    form.reset();
    lastAttempt = undefined;
    showReceipt(receipt);
  } catch (error) {
    if (error.status === 409) await loadMenu();
    showMessage(submitError, error.message);
  } finally {
    submitting = false;
    submit.firstChild.textContent = "提交点单 ";
    renderCart();
  }
});

renderCart();
loadMenu();

</script>
</body>
</html>
